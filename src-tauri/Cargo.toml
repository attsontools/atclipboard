[package]
name = "atclipboard"
version = "0.1.0-alpha.0"
description = "Clipboard history"
authors = ["Attson"]
edition = "2021"

[lib]
name = "atclipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
atclipboard-service = { path = ".." }
serde_json = "1"
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-single-instance = "=2.5.5"
